# Builds the whole solution on Windows (the WPF projects need it), runs both test suites,
# publishes the app, packs it into GhostClick-Setup-<version>.exe with Inno Setup
# (installer/GhostClick.iss) and uploads that (Actions -> the run -> Artifacts). Then it
# installs the setup silently on the runner, checks the shortcuts and the uninstall entry,
# starts the installed app and waits for its interface, and uninstalls it again.
#
# Pushing a tag vX.Y.Z (matching <Version> in GhostClick.App.csproj) also publishes the
# setup as a GitHub release - the link to hand out.
name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  INNO_SETUP_PACKAGE: innosetup-compiler@6.3.1

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GhostClick.sln

      - name: Build engine, bridge, app and dev harness
        run: dotnet build GhostClick.sln -c Release --no-restore

      - name: Test engine
        run: >
          dotnet test tests/ClickerEngine.Core.Tests/ClickerEngine.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=engine.trx" --results-directory TestResults

      - name: Test bridge
        run: >
          dotnet test tests/GhostClick.Bridge.Tests/GhostClick.Bridge.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=bridge.trx" --results-directory TestResults

      # A tag build is the release <Version> names and must match it; any other build is
      # <Version>-dev.<run number>, so two test setups never share a name.
      - name: Work out the version
        shell: pwsh
        run: |
          $csproj = Get-Content src/GhostClick.App/GhostClick.App.csproj -Raw
          if ($csproj -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') { throw 'GhostClick.App.csproj has no <Version>X.Y.Z</Version>' }
          $base = $Matches[1]

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$base") {
              throw "The tag $env:GITHUB_REF_NAME does not match <Version>$base</Version> in GhostClick.App.csproj"
            }
            $version = $base
          } else {
            $version = "$base-dev.$env:GITHUB_RUN_NUMBER"
          }

          Write-Host "Version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "FILE_VERSION=$base.0" >> $env:GITHUB_ENV

      # A plain folder rather than one big exe: the installer compresses it far better, and
      # the app starts faster without unpacking itself first.
      - name: Publish the app
        run: >
          dotnet publish src/GhostClick.App/GhostClick.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none -p:PublishDocumentationFiles=false
          -o publish/app

      - name: Check the published app
        shell: pwsh
        run: |
          $required = 'GhostClick.exe', 'wwwroot/index.html', 'wwwroot/app.js', 'wwwroot/host.js',
                      'wwwroot/layout.js', 'wwwroot/app.css', 'wwwroot/vendor/preact.min.js',
                      'wwwroot/vendor/htm.min.js', 'wwwroot/fonts/Geist-Variable.woff2'
          foreach ($file in $required) {
            if (-not (Test-Path "publish/app/$file")) { throw "The published app is missing $file" }
          }

          # Debug symbols and API docs are of no use to someone running the app.
          $clutter = Get-ChildItem publish/app -Recurse -File -Include *.pdb, *.xml
          if ($clutter) { throw "The published app carries files nobody needs: $($clutter.Name -join ', ')" }

          $files = Get-ChildItem publish/app -Recurse -File
          Write-Host ("{0} files, {1:N0} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB))

          # The exe must carry the GhostClick icon, not the generic one Windows shows for an
          # exe without any: the ghost sits on a dark slate square, the generic icon is light.
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path publish/app/GhostClick.exe).Path)
          $bitmap = $icon.ToBitmap()
          $dark = 0
          for ($y = 0; $y -lt $bitmap.Height; $y++) {
            for ($x = 0; $x -lt $bitmap.Width; $x++) {
              $c = $bitmap.GetPixel($x, $y)
              if ($c.A -gt 200 -and $c.R -lt 60 -and $c.G -lt 60 -and $c.B -lt 80 -and $c.B -ge $c.R) { $dark++ }
            }
          }
          Write-Host "Icon: $($bitmap.Width)x$($bitmap.Height), $dark dark slate pixels"
          if ($dark -lt 200) { throw 'GhostClick.exe does not carry the GhostClick icon' }

      # Inno Setup from npm: a pinned, unpacked compiler, nothing installed on the runner.
      - name: Get Inno Setup
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP inno
          New-Item -ItemType Directory -Force $dir | Out-Null
          npm pack $env:INNO_SETUP_PACKAGE --pack-destination $dir --silent
          if ($LASTEXITCODE -ne 0) { throw "npm pack $env:INNO_SETUP_PACKAGE failed" }
          # Windows' own tar: Git's GNU tar would read C:\... as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -xzf (Get-ChildItem $dir -Filter *.tgz).FullName -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'Unpacking Inno Setup failed' }
          $iscc = Join-Path $dir package/bin/ISCC.exe
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe is not where the package should have it' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # The setup carries Microsoft's small WebView2 bootstrapper and runs it only on a PC
      # without the runtime. It is taken only if Microsoft's signature on it checks out.
      - name: Get the WebView2 bootstrapper
        shell: pwsh
        run: |
          $file = 'installer/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $file
          $signature = Get-AuthenticodeSignature $file
          Write-Host "Signature: $($signature.Status), $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'The WebView2 bootstrapper is not signed by Microsoft'
          }

      - name: Build the installer
        shell: pwsh
        run: |
          & $env:ISCC installer/GhostClick.iss "/DAppVersion=$env:VERSION" "/DFileVersion=$env:FILE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = Get-Item "publish/installer/GhostClick-Setup-$env:VERSION.exe"
          Write-Host ("{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB))

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: GhostClick-Setup-${{ env.VERSION }}
          path: publish/installer/GhostClick-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      # What a user gets, checked end to end: the silent install puts the app, the Start menu
      # and desktop shortcuts and the «Apps» entry in place; the installed app starts and
      # shows its interface (the page draws nothing until the engine has answered it, so the
      # green «Старт» and the blue ЛКМ prove WebView2, the page, the bridge and the engine);
      # the uninstaller takes everything away again but the user's profiles.
      - name: Install, run and uninstall
        shell: pwsh
        # A message box in a silent uninstall would hang here rather than fail.
        timeout-minutes: 10
        run: |
          $runtimeKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = try { (Get-ItemProperty $runtimeKey -ErrorAction Stop).pv } catch { 'not found' }
          Write-Host "WebView2 Runtime: $runtime"

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\GhostClick'
          $exe = Join-Path $installDir 'GhostClick.exe'
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'GhostClick.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'GhostClick.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6E27B7AA-6BAA-4941-93BB-7998B449A0AA}_is1'
          $profiles = Join-Path $env:APPDATA 'GhostClick'

          # --- Install ---
          $setup = (Resolve-Path "publish/installer/GhostClick-Setup-$env:VERSION.exe").Path
          $install = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$PWD\install.log"
          if ($install.ExitCode -ne 0) { throw "Setup failed with exit code $($install.ExitCode); see install.log" }

          foreach ($path in $exe, (Join-Path $installDir 'wwwroot\index.html'), $startMenu, $desktop) {
            if (-not (Test-Path $path)) { throw "Setup did not create $path" }
          }

          $shell = New-Object -ComObject WScript.Shell
          foreach ($link in $startMenu, $desktop) {
            $target = $shell.CreateShortcut($link).TargetPath
            if ($target -ne $exe) { throw "$link points at '$target' instead of $exe" }
          }

          $entry = Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue
          if (-not $entry) { throw 'Setup registered no uninstall entry' }
          Write-Host "Apps entry: $($entry.DisplayName) $($entry.DisplayVersion), icon $($entry.DisplayIcon)"
          if ($entry.DisplayName -ne 'GhostClick' -or $entry.DisplayVersion -ne $env:VERSION) {
            throw 'The uninstall entry has the wrong name or version'
          }
          Write-Host "Installed into $installDir with Start menu and desktop shortcuts."

          # --- Run ---
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          function Get-Screenshot {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $graphics.Dispose()
            return $bitmap
          }

          # Samples every 6th pixel; plenty for areas the size of a button.
          function Measure-Colour($bitmap, [int]$r, [int]$g, [int]$b) {
            $count = 0
            for ($y = 0; $y -lt $bitmap.Height; $y += 6) {
              for ($x = 0; $x -lt $bitmap.Width; $x += 6) {
                $c = $bitmap.GetPixel($x, $y)
                if ([math]::Abs($c.R - $r) -le 12 -and [math]::Abs($c.G - $g) -le 12 -and [math]::Abs($c.B - $b) -le 12) { $count++ }
              }
            }
            return $count
          }

          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $rendered = $false

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            if ($app.HasExited) { throw "GhostClick exited on its own with code $($app.ExitCode)" }

            $shot = Get-Screenshot
            $green = Measure-Colour $shot 48 209 88    # «Старт», F6
            $blue = Measure-Colour $shot 10 132 255    # ЛКМ, «Действия»
            $shot.Save("$PWD/smoke-test.png")
            $shot.Dispose()
            Write-Host "Interface pixels: green $green, blue $blue"

            if ($green -gt 20 -and $blue -gt 20) { $rendered = $true; break }
          }

          if (-not $rendered) {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            throw 'The interface did not appear within 90 seconds; see the smoke-test-screenshot artifact.'
          }
          Write-Host 'The installed app rendered its interface.'

          # Closed the way a user closes it, and uninstalled straight away: the page's browser
          # processes may still hold the cache folder, which the uninstaller has to cope with.
          $app.CloseMainWindow() | Out-Null
          if (-not $app.WaitForExit(15000)) { throw 'GhostClick did not close when its window was closed' }

          # --- Uninstall ---
          # A stand-in for the user's profiles: a silent uninstall must keep them.
          New-Item -ItemType Directory -Force $profiles | Out-Null
          Set-Content (Join-Path $profiles 'uninstall-keeps-this.txt') 'profiles stay'

          # The command Windows tools and winget run: /SILENT, message boxes not suppressed.
          # The uninstaller hands over to a copy of itself and returns at once; wait for it.
          if ($entry.QuietUninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "Unexpected QuietUninstallString: $($entry.QuietUninstallString)" }
          Write-Host "Uninstalling with: $($entry.QuietUninstallString)"
          Start-Process $Matches[1] -Wait -ArgumentList $Matches[2]
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and ((Test-Path $installDir) -or (Test-Path $uninstallKey))) {
            Start-Sleep -Seconds 1
          }

          foreach ($path in $installDir, $startMenu, $desktop, $uninstallKey, (Join-Path $env:LOCALAPPDATA 'GhostClick')) {
            if (Test-Path $path) { throw "The uninstaller left $path behind" }
          }
          if (-not (Test-Path (Join-Path $profiles 'uninstall-keeps-this.txt'))) { throw 'The uninstaller removed the user profiles' }
          Remove-Item -Recurse -Force $profiles
          Write-Host 'Uninstalled cleanly; the profiles were kept.'

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-screenshot
          path: smoke-test.png
          if-no-files-found: ignore

      - name: Upload test results and install log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics
          path: |
            TestResults
            install.log
          if-no-files-found: ignore

  # Only for a version tag, and only after the setup above installed, ran and uninstalled.
  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: GhostClick-Setup-*
          merge-multiple: true
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Installation

          1. Download **GhostClick-Setup-${version}.exe** below, under Assets. If your browser warns that the file "isn't commonly downloaded", choose "Keep" in the download menu (and confirm once more if it asks again).
          2. Run it. If Windows shows "Windows protected your PC", click **More info → Run anyway**: the installer isn't signed with a paid certificate, so Windows doesn't recognize it yet.
          3. Keep clicking "Next", then click "Install". No administrator rights needed. If your Windows isn't in English, the installer is in Russian: "Далее" means Next and "Установить" means Install.

          GhostClick appears in the Start menu and on the desktop. It needs 64-bit Windows 10 or 11; if the computer has no Microsoft Edge WebView2 component, the installer adds it for you.

          A new version installs over the old one and keeps your profiles. To uninstall GhostClick, go to **Settings → Apps**.

          The GhostClick interface is in Russian for now.

          ---

          ## Установка

          1. Скачайте **GhostClick-Setup-${version}.exe** ниже, в разделе Assets. Если браузер предупредит, что такой файл скачивают редко, выберите в меню загрузки «Сохранить» (и подтвердите, если он спросит ещё раз).
          2. Запустите его. Если Windows покажет «Система Windows защитила ваш компьютер», нажмите **Подробнее → Выполнить в любом случае**: установщик не подписан платным сертификатом, поэтому Windows его пока не знает.
          3. Нажимайте «Далее», а в конце «Установить». Права администратора не нужны.

          GhostClick появится в меню «Пуск» и на рабочем столе. Нужна 64-битная Windows 10 или 11; если на компьютере нет компонента Microsoft Edge WebView2, установщик поставит его сам.

          Новая версия ставится поверх старой, профили сохраняются. Удалить программу можно через **Параметры → Приложения**.
          EOF
          # A release made by hand on the Releases page for this tag (which is what pushed the
          # tag) gets the setup attached; if it was published with no text, it also gets the
          # title and notes above, otherwise its own stay. --verify-tag stops gh from
          # re-creating a tag deleted meanwhile at the head of the default branch.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/GhostClick-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "GhostClick ${version}" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/GhostClick-Setup-*.exe --verify-tag \
              --repo "$GITHUB_REPOSITORY" --title "GhostClick ${version}" --notes-file notes.md
          fi
